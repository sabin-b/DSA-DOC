<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <!-- Primary gradient (purple/indigo) -->
    <linearGradient id="fgrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
    </linearGradient>
    <!-- Accent gradient (cyan/teal) -->
    <linearGradient id="fgrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06B6D4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#22D3EE;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Dark background circle -->
  <circle cx="16" cy="16" r="15" fill="#0F0F23"/>
  
  <!-- Simplified binary tree structure -->
  <g stroke="url(#fgrad2)" stroke-width="1.5" stroke-linecap="round">
    <!-- Tree edges -->
    <line x1="16" y1="9" x2="11" y2="14"/>
    <line x1="16" y1="9" x2="21" y2="14"/>
    <line x1="11" y1="14" x2="8" y2="19"/>
    <line x1="11" y1="14" x2="14" y2="19"/>
    <line x1="21" y1="14" x2="18" y2="19"/>
    <line x1="21" y1="14" x2="24" y2="19"/>
  </g>
  
  <!-- Tree nodes -->
  <g>
    <!-- Root -->
    <circle cx="16" cy="9" r="3" fill="url(#fgrad1)"/>
    <!-- Level 1 -->
    <circle cx="11" cy="14" r="2.5" fill="url(#fgrad2)"/>
    <circle cx="21" cy="14" r="2.5" fill="url(#fgrad2)"/>
    <!-- Level 2 -->
    <circle cx="8" cy="19" r="2" fill="url(#fgrad1)" opacity="0.8"/>
    <circle cx="14" cy="19" r="2" fill="url(#fgrad1)" opacity="0.8"/>
    <circle cx="18" cy="19" r="2" fill="url(#fgrad1)" opacity="0.8"/>
    <circle cx="24" cy="19" r="2" fill="url(#fgrad1)" opacity="0.8"/>
  </g>
  
  <!-- Tiny curly braces (simplified) -->
  <g fill="none" stroke="url(#fgrad2)" stroke-width="1.2" stroke-linecap="round">
    <path d="M 5 14 Q 4 14, 4 15.5 L 4 16.5 Q 4 17, 5 17"/>
    <path d="M 27 14 Q 28 14, 28 15.5 L 28 16.5 Q 28 17, 27 17"/>
  </g>
</svg>
