<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Gradient for the primary color -->
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
    </linearGradient>
    <!-- Gradient for accent elements -->
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06B6D4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#22D3EE;stop-opacity:1" />
    </linearGradient>
    <!-- Subtle shadow filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#1e1b4b" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Background circle with subtle gradient -->
  <circle cx="64" cy="64" r="58" fill="#0F0F23" opacity="0.95"/>
  <circle cx="64" cy="64" r="58" fill="url(#grad1)" opacity="0.08"/>
  
  <!-- Binary Tree Structure -->
  <g filter="url(#shadow)">
    <!-- Connection lines (edges) -->
    <g stroke="url(#grad2)" stroke-width="2.5" stroke-linecap="round" opacity="0.7">
      <!-- Root to children -->
      <line x1="64" y1="32" x2="40" y2="52"/>
      <line x1="64" y1="32" x2="88" y2="52"/>
      <!-- Left child to its children -->
      <line x1="40" y1="52" x2="28" y2="72"/>
      <line x1="40" y1="52" x2="52" y2="72"/>
      <!-- Right child to its children -->
      <line x1="88" y1="52" x2="76" y2="72"/>
      <line x1="88" y1="52" x2="100" y2="72"/>
    </g>
    
    <!-- Nodes -->
    <g>
      <!-- Root node -->
      <circle cx="64" cy="32" r="10" fill="url(#grad1)"/>
      <circle cx="64" cy="32" r="7" fill="#0F0F23"/>
      
      <!-- Left child node -->
      <circle cx="40" cy="52" r="9" fill="url(#grad2)"/>
      <circle cx="40" cy="52" r="6" fill="#0F0F23"/>
      
      <!-- Right child node -->
      <circle cx="88" cy="52" r="9" fill="url(#grad2)"/>
      <circle cx="88" cy="52" r="6" fill="#0F0F23"/>
      
      <!-- Bottom left-left node -->
      <circle cx="28" cy="72" r="7" fill="url(#grad1)" opacity="0.7"/>
      <circle cx="28" cy="72" r="4.5" fill="#0F0F23"/>
      
      <!-- Bottom left-right node -->
      <circle cx="52" cy="72" r="7" fill="url(#grad1)" opacity="0.7"/>
      <circle cx="52" cy="72" r="4.5" fill="#0F0F23"/>
      
      <!-- Bottom right-left node -->
      <circle cx="76" cy="72" r="7" fill="url(#grad1)" opacity="0.7"/>
      <circle cx="76" cy="72" r="4.5" fill="#0F0F23"/>
      
      <!-- Bottom right-right node -->
      <circle cx="100" cy="72" r="7" fill="url(#grad1)" opacity="0.7"/>
      <circle cx="100" cy="72" r="4.5" fill="#0F0F23"/>
    </g>
  </g>
  
  <!-- Code bracket accents -->
  <g fill="none" stroke="url(#grad2)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <!-- Left curly brace -->
    <path d="M 18 56 Q 14 56, 14 62 L 14 66 Q 14 70, 18 70 L 18 74 Q 22 74, 22 78 L 22 86 Q 22 90, 18 90"/>
    <!-- Right curly brace -->
    <path d="M 110 56 Q 114 56, 114 62 L 114 66 Q 114 70, 110 70 L 110 74 Q 106 74, 106 78 L 106 86 Q 106 90, 110 90"/>
  </g>
  
  <!-- Decorative dots (array elements representation) -->
  <g fill="url(#grad1)" opacity="0.5">
    <circle cx="22" cy="38" r="2"/>
    <circle cx="28" cy="38" r="2"/>
    <circle cx="34" cy="38" r="2"/>
  </g>
  <g fill="url(#grad2)" opacity="0.5">
    <circle cx="94" cy="38" r="2"/>
    <circle cx="100" cy="38" r="2"/>
    <circle cx="106" cy="38" r="2"/>
  </g>
</svg>
